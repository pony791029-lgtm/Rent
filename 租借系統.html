<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品嘉建設集團 - 設備租借管理系統</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; position: relative; min-height: 100vh; }
        .container { max-width: 1050px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; z-index: 1; }
        h1 { text-align: center; color: #1a365d; margin-top: 0; margin-bottom: 25px; font-size: 1.8rem; }
        
        /* 頁籤導覽標籤 */
        .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 14px; text-align: center; background: none; border: none; font-size: 1.05rem; font-weight: bold; color: #4a5568; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; }
        .tab-btn:hover:not(:disabled) { color: #2b6cb0; }
        .tab-btn.active { color: #2b6cb0; border-bottom-color: #2b6cb0; background-color: #ebf8ff; }
        
        /* 停用/反白頁籤樣式 */
        .tab-btn:disabled { opacity: 0.45; cursor: not-allowed; color: #a0aec0; background-color: #f7fafc; pointer-events: none; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 按鈕與連結樣式 */
        .btn { background-color: #3182ce; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background-color: #2b6cb0; }
        .btn-success { background-color: #38a169; }
        .btn-success:hover { background-color: #2f855a; }
        .btn-sm { padding: 5px 12px; font-size: 0.85rem; }
        
        .btn-link { background: none; border: none; color: #3182ce; cursor: pointer; padding: 0; font-size: 0.85rem; text-decoration: underline; font-weight: 600; }
        .btn-link:hover { color: #2b6cb0; }
        .btn-link.text-danger { color: #e53e3e; }
        .btn-link.text-danger:hover { color: #c53030; }
        
        /* 表格樣式 */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 0.95rem; vertical-align: top; }
        th { background-color: #f7fafc; color: #4a5568; font-weight: bold; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        /* Modal 彈出視窗樣式 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: #fff; border-radius: 10px; width: 90%; max-width: 600px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; color: #2d3748; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #a0aec0; }
        
        /* 表單元件 */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #2d3748; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.95rem; }
        select:disabled { background-color: #edf2f7; cursor: not-allowed; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        
        /* 標籤徽章與租用中標示 */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
        .badge-borrowing { background-color: #feebc8; color: #c05621; }
        .badge-returned { background-color: #c6f6d5; color: #22543d; }
        .option-rented { color: #e53e3e; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏢 品嘉建設集團 - 設備租借管理系統</h1>

    <!-- 頁籤按鈕 (新增設備欄維持反白停用) -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">1. 租借設備</button>
        <button class="tab-btn" onclick="switchTab(1)">2. 設備借用狀態</button>
        <button class="tab-btn" disabled>3. 新增設備 (開發中)</button>
    </div>

    <!-- 模組 1: 租借設備頁面 -->
    <div class="tab-content active" id="tab-0">
        <div style="text-align: center; padding: 40px 0;">
            <p style="font-size: 1.1rem; color: #4a5568;">點擊下方按鈕開始填寫設備預借申請單：</p>
            <button class="btn" onclick="openBorrowModal()" style="padding: 12px 30px; font-size: 1.1rem;">➕ 新建租借申請</button>
        </div>
    </div>

    <!-- 模組 2: 設備借用狀態 (借用紀錄) -->
    <div class="tab-content" id="tab-1">
        <h3>📋 當前設備借用紀錄與狀態</h3>
        <table>
            <thead>
                <tr>
                    <th>狀態</th>
                    <th>租借單位 (部門)</th>
                    <th>租借人</th>
                    <th>租借項目</th>
                    <th>租借日期</th>
                    <th>預計歸還日期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="statusTableBody">
                <!-- 動態注入 -->
            </tbody>
        </table>

        <!-- 頁面最下方繼續租用按鈕 -->
        <div style="margin-top: 25px; text-align: right; padding-top: 15px; border-top: 1px dashed #e2e8f0;">
            <button class="btn" onclick="openBorrowModal()">🔄 繼續租用其他設備 / 時段</button>
        </div>
    </div>
</div>

<!-- 租借申請 / 編輯 Modal 彈出視窗 -->
<div class="modal-overlay" id="borrowModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">📝 新建設備租借申請單</h3>
            <button class="close-btn" onclick="closeBorrowModal()">&times;</button>
        </div>
        <form id="borrowForm">
            <!-- 租借單位選單 -->
            <div class="form-row">
                <div class="form-group">
                    <label>1. 租借單位 (部門) *</label>
                    <select id="departmentSelect" required onchange="handleDepartmentChange()">
                        <option value="">-- 請選擇租借單位 --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>2. 租用人 *</label>
                    <select id="employeeSelect" required disabled>
                        <option value="">-- 請先選擇單位 --</option>
                    </select>
                </div>
            </div>

            <!-- 日期選擇 -->
            <div class="form-row">
                <div class="form-group">
                    <label>借用日期 *</label>
                    <input type="date" id="borrowDate" required>
                </div>
                <div class="form-group">
                    <label>預計歸還日期 *</label>
                    <input type="date" id="returnDate" required>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">
            <h4 style="margin-top:0; color:#2d3748;">選取租借項目</h4>

            <!-- 獨立品項下拉選單 -->
            <div class="form-group">
                <label>1. 音箱+麥克風</label>
                <select id="item_speaker" class="equipment-select"></select>
            </div>
            <div class="form-group">
                <label>2. 投影機</label>
                <select id="item_projector" class="equipment-select"></select>
            </div>
            <div class="form-group">
                <label>3. 攝影機組</label>
                <select id="item_camera" class="equipment-select"></select>
            </div>
            <div class="form-group">
                <label>4. 布幕</label>
                <select id="item_screen" class="equipment-select"></select>
            </div>
            <div class="form-group">
                <label>5. 其他設備</label>
                <select id="item_other" class="equipment-select"></select>
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">確認並提交申請</button>
        </form>
    </div>
</div>

<script>
    // 依據員工通訊錄建立之名冊資料
    const employees = [
        { name: "胡偉良", dept: "董事長室" }, { name: "徐秀蘭", dept: "董事長室" },
        { name: "高駿杰", dept: "董事長室" }, { name: "林筱淇", dept: "董事長室" },
        { name: "王明水", dept: "董事長室" }, { name: "張裕錦", dept: "董事長室" },
        { name: "林崇逸", dept: "董事長室" }, { name: "張殿文", dept: "董事長室" },
        { name: "邱聖雯", dept: "董事長室" }, { name: "黃馨慧", dept: "董事長室" },
        { name: "陳人豪", dept: "董事長室" }, { name: "楊薇蓉", dept: "董事長室" },
        { name: "陳其偉", dept: "總經理室" }, { name: "蕭溏寓", dept: "總經理室" },
        { name: "林士傑", dept: "總經理室" }, { name: "蘇科", dept: "總經理室" },
        { name: "廖美玲", dept: "財會部" }, { name: "姚慈慧", dept: "財會部" },
        { name: "陳岳彤", dept: "財會部" }, { name: "張紘瑋", dept: "多媒體行銷部" },
        { name: "洪易", dept: "多媒體行銷部" }, { name: "陳皇賓", dept: "多媒體行銷部" },
        { name: "趙怡如", dept: "多媒體行銷部" }, { name: "吳淳仁", dept: "多媒體行銷部" },
        { name: "劉謦豪", dept: "AI 資訊部" }, { name: "齊軒", dept: "AI 資訊部" },
        { name: "常逸", dept: "AI 資訊部" }, { name: "趙宥迪", dept: "營銷事業部" },
        { name: "吳忠逸", dept: "營銷事業部" }, { name: "孫浩庭", dept: "客服與客戶關係部" },
        { name: "沈怡汝", dept: "客服與客戶關係部" }, { name: "丁元鴻", dept: "客服與客戶關係部" },
        { name: "陳姿燕", dept: "客服與客戶關係部" }, { name: "林佩榛", dept: "管理與事業發展部" },
        { name: "黃雅娸", dept: "都市更新開發一部" }, { name: "賴仲翊", dept: "都市更新開發二部" },
        { name: "陳洪名", dept: "都市更新開發三部" }, { name: "蘇惠秋", dept: "都市更新開發四部" },
        { name: "陳建銘", dept: "都更計畫部" }, { name: "張德健", dept: "創新研發部" },
        { name: "劉筱蕾", dept: "工程顧問部" }, { name: "邱淑瑛", dept: "採購部" },
        { name: "王靖夫", dept: "工程事業部" }
    ];

    // 設備清單
    let equipmentCatalog = {
        item_speaker: { 
            category: "音箱+麥克風", 
            items: ["小音箱A(1線+麥克風*1)", "小音箱B(1線+麥克風*1)", "大音箱+麥克風*2"] 
        },
        item_projector: { 
            category: "投影機", 
            items: ["白色投影A(2線+1遙控)", "白色投影B(2線+1遙控)", "黑色投影"] 
        },
        item_camera: { category: "攝影機組", items: ["攝影機 3740140", "攝影機 664352", "攝影機 3740768"] },
        item_screen: { category: "布幕", items: ["大布幕", "小布幕"] },
        item_other: { category: "其他設備", items: ["延長線", "筆電"] }
    };

    // 借用紀錄庫與當前編輯狀態
    let rentalRecords = [];
    let editingRecordId = null;

    // 頁面初始化
    window.onload = function() {
        initDepartmentDropdown();
        refreshEquipmentDropdowns();
        renderStatusTable();
    };

    // 頁籤切換
    function switchTab(index) {
        const tabs = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');
        tabs.forEach((tab, i) => {
            if (!tab.disabled) {
                tab.classList.toggle('active', i === index);
                contents[i].classList.toggle('active', i === index);
            }
        });
    }

    // 初始化「租借單位」下拉選單
    function initDepartmentDropdown() {
        const deptSelect = document.getElementById('departmentSelect');
        deptSelect.innerHTML = '<option value="">-- 請選擇租借單位 --</option>';
        
        const depts = [...new Set(employees.map(emp => emp.dept))];
        depts.forEach(dept => {
            let opt = document.createElement('option');
            opt.value = dept;
            opt.textContent = dept;
            deptSelect.appendChild(opt);
        });
    }

    // 當選擇「租借單位」後，動態更換「租用人」選單
    function handleDepartmentChange() {
        const selectedDept = document.getElementById('departmentSelect').value;
        const empSelect = document.getElementById('employeeSelect');
        empSelect.innerHTML = '<option value="">-- 請選擇人員 --</option>';
        
        if (!selectedDept) {
            empSelect.disabled = true;
            return;
        }

        const filteredEmps = employees.filter(e => e.dept === selectedDept);
        filteredEmps.forEach(emp => {
            let opt = document.createElement('option');
            opt.value = emp.name;
            opt.textContent = emp.name;
            empSelect.appendChild(opt);
        });
        empSelect.disabled = false;
    }

    // Modal 視窗開啟 (新建申請 / 繼續租用)
    function openBorrowModal() {
        editingRecordId = null;
        document.getElementById('modalTitle').textContent = '📝 新建設備租借申請單';
        document.getElementById('borrowForm').reset();
        document.getElementById('employeeSelect').disabled = true;
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('borrowDate').value = today;
        document.getElementById('returnDate').value = today;

        refreshEquipmentDropdowns();
        document.getElementById('borrowModal').style.display = 'flex';
    }

    // Modal 視窗關閉
    function closeBorrowModal() {
        document.getElementById('borrowModal').style.display = 'none';
        editingRecordId = null;
    }

    // 取得當前所有使用中的設備名稱 (可排除當前編輯的單號)
    function getCurrentlyRentedItems(ignoreRecordId = null) {
        let rentedItems = new Set();
        rentalRecords.forEach(record => {
            if (record.status === '使用中' && record.id !== ignoreRecordId) {
                record.items.forEach(item => rentedItems.add(item));
            }
        });
        return rentedItems;
    }

    // 刷新設備下拉選單
    function refreshEquipmentDropdowns(ignoreRecordId = null) {
        const rentedItems = getCurrentlyRentedItems(ignoreRecordId);
        
        for (let key in equipmentCatalog) {
            const selectEl = document.getElementById(key);
            if (!selectEl) continue;
            
            selectEl.innerHTML = '<option value="">-- 不租借此類別 --</option>';
            equipmentCatalog[key].items.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item;
                if (rentedItems.has(item)) {
                    opt.textContent = `${item} (租用中)`;
                    opt.disabled = true;
                    opt.className = 'option-rented';
                } else {
                    opt.textContent = item;
                }
                selectEl.appendChild(opt);
            });
        }
    }

    // 提交租借單 (新增或編輯儲存)
    document.getElementById('borrowForm').addEventListener('submit', function(e) {
        e.preventDefault();

        let selectedItems = [];
        document.querySelectorAll('.equipment-select').forEach(select => {
            if (select.value) selectedItems.push(select.value);
        });

        if (selectedItems.length === 0) {
            alert('⚠️ 請至少選取一個租借項目！');
            return;
        }

        if (editingRecordId) {
            // 修改現有紀錄
            const record = rentalRecords.find(r => r.id === editingRecordId);
            if (record) {
                record.department = document.getElementById('departmentSelect').value;
                record.borrower = document.getElementById('employeeSelect').value;
                record.borrowDate = document.getElementById('borrowDate').value;
                record.returnDate = document.getElementById('returnDate').value;
                record.items = selectedItems;
            }
            alert('✅ 租借內容已成功修改！');
        } else {
            // 新增紀錄
            const record = {
                id: Date.now(),
                department: document.getElementById('departmentSelect').value,
                borrower: document.getElementById('employeeSelect').value,
                borrowDate: document.getElementById('borrowDate').value,
                returnDate: document.getElementById('returnDate').value,
                items: selectedItems,
                status: '使用中'
            };
            rentalRecords.push(record);
            alert('✅ 設備租借登記成功！');
        }

        closeBorrowModal();
        this.reset();
        document.getElementById('employeeSelect').disabled = true;
        
        renderStatusTable();
        switchTab(1);
    });

    // 渲染設備借用狀態表格
    function renderStatusTable() {
        const tbody = document.getElementById('statusTableBody');
        tbody.innerHTML = '';

        if (rentalRecords.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#a0aec0;">目前尚無任何租借紀錄</td></tr>';
            return;
        }

        rentalRecords.forEach(record => {
            let tr = document.createElement('tr');
            let isBorrowing = record.status === '使用中';
            
            tr.innerHTML = `
                <td>
                    <span class="badge ${isBorrowing ? 'badge-borrowing' : 'badge-returned'}">${record.status}</span>
                </td>
                <td><strong>${record.department}</strong></td>
                <td>${record.borrower}</td>
                <td>${record.items.join(', ')}</td>
                <td>${record.borrowDate}</td>
                <td>${record.returnDate}</td>
                <td>
                    ${isBorrowing ? `<button class="btn btn-sm btn-success" onclick="returnEquipment(${record.id})">辦理歸還</button>` : '<span style="color:#a0aec0;">已歸還</span>'}
                    <div style="margin-top: 8px; display: flex; gap: 10px;">
                        <button class="btn-link" onclick="editEquipment(${record.id})">✏️ 編輯</button>
                        <button class="btn-link text-danger" onclick="deleteEquipment(${record.id})">🗑️ 刪除</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 編輯租借內容
    function editEquipment(id) {
        const record = rentalRecords.find(r => r.id === id);
        if (!record) return;

        editingRecordId = id;
        document.getElementById('modalTitle').textContent = '✏️ 編輯設備租借內容';

        // 帶入部門與人員
        document.getElementById('departmentSelect').value = record.department;
        handleDepartmentChange();
        document.getElementById('employeeSelect').value = record.borrower;

        // 帶入日期
        document.getElementById('borrowDate').value = record.borrowDate;
        document.getElementById('returnDate').value = record.returnDate;

        // 刷新下拉選單，讓該單自己借用的項目恢復可選
        refreshEquipmentDropdowns(id);

        // 帶入原選取設備
        for (let key in equipmentCatalog) {
            const selectEl = document.getElementById(key);
            if (!selectEl) continue;
            selectEl.value = "";
            equipmentCatalog[key].items.forEach(item => {
                if (record.items.includes(item)) {
                    selectEl.value = item;
                }
            });
        }

        document.getElementById('borrowModal').style.display = 'flex';
    }

    // 刪除整張租用單
    function deleteEquipment(id) {
        const record = rentalRecords.find(r => r.id === id);
        if (record && confirm(`確定要刪除 [${record.borrower}] 的此筆租借紀錄嗎？刪除後紀錄將無法恢復。`)) {
            rentalRecords = rentalRecords.filter(r => r.id !== id);
            renderStatusTable();
            refreshEquipmentDropdowns();
            alert('🗑️ 租借紀錄已成功刪除！');
        }
    }

    // 辦理歸還
    function returnEquipment(id) {
        const record = rentalRecords.find(r => r.id === id);
        if (record && confirm(`確定要把 [${record.borrower}] 借用的【${record.items.join(', ')}】辦理歸還嗎？`)) {
            record.status = '已歸還';
            renderStatusTable();
            refreshEquipmentDropdowns();
            alert('✅ 設備辦理歸還成功！已重新放回可用庫存。');
        }
    }
</script>

</body>
</html>
